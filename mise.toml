[tools]
bun = "latest"
node = "20"
hk = "latest"
biome = "latest"
markdownlint-cli2 = "latest"

[hooks]
enter = "mise install; bun install"
postinstall = "hk install --mise"

[tasks.build]
description = "Compile TypeScript to dist/ via Vite"
run = "bun run scripts/build.ts"

[tasks."generate:schema"]
description = "Generate the personality JSON schema from the Zod types"
run = "bun run scripts/generate-schema.ts"

[tasks."dev:hook"]
description = "Run the SessionStart hook locally"
run = "bun run src/hooks/inject.ts"

[tasks."dev:cli"]
description = "Run the personality switcher CLI locally"
run = "bun run src/cli/switch.ts"

[tasks."install:plugin"]
description = "Seed personality data and the skill symlink for local dev"
run = "node dist/install.mjs"

[tasks.typecheck]
description = "Type-check without emitting"
run = "bunx tsc --noEmit"

[tasks.lint]
description = "Lint src/ with biome"
run = "biome check src/"

[tasks."lint:fix"]
description = "Lint and auto-fix src/ with biome"
run = "biome check --write src/"

[tasks.format]
description = "Format src/ with biome"
run = "biome format --write src/"

[tasks."lint:markdown"]
description = "Lint markdown files with markdownlint-cli2"
run = 'markdownlint-cli2 "**/*.md"'

[tasks."lint:markdown:fix"]
description = "Lint and auto-fix markdown files with markdownlint-cli2"
run = 'markdownlint-cli2 --fix "**/*.md"'
