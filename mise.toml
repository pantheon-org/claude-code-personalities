[tools]
bun = "1.3.14"
node = "20.20.2"
hk = "1.55.0"
biome = "2.5.8"
actionlint = "1.7.12"
"npm:markdownlint-cli" = "0.49.1"
"npm:aislop" = "0.14.1"
"npm:ctxharness" = "0.4.6"

[hooks]
enter = "mise install; bun install"
postinstall = "hk install --mise"

[tasks.build]
description = "Compile TypeScript to dist/ via Vite"
run = "bun run scripts/build.ts"

[tasks.test]
description = "Run the bun test suite under src/"
run = "bun test"

[tasks."generate:schema"]
description = "Generate the personality JSON schema from the Zod types"
run = "bun run scripts/generate-schema.ts"

[tasks."dev:hook"]
description = "Run the SessionStart hook locally"
run = "bun run src/hooks/inject.ts"

[tasks."dev:cli"]
description = "Run the personality switcher CLI locally"
run = "bun run src/cli/switch.ts"

[tasks."install:plugin"]
description = "Seed personality data and the skill symlink for local dev"
run = "node dist/install.mjs"

[tasks.ctx]
description = "Check AI instruction files (AGENTS.md/CLAUDE.md) for drift"
run = "ctxharness run --no-trend"

[tasks."slop:check"]
description = "Run the aislop quality gate over the whole repo"
run = "aislop ci"

[tasks."slop:changes"]
description = "Run the aislop quality gate over changed files (AISLOP_BASE, default HEAD)"
run = "aislop ci --changes --base ${AISLOP_BASE:-HEAD}"

[tasks."generate:hashes"]
description = "Record the hash of every published version of each bundled personality"
run = "bun run scripts/generate-shipped-hashes.ts"
