# ctxharness configuration — generated by `ctxharness init`, then hand-tailored.
# `ctxharness init` extracts every path-like token from files.include and asserts
# it exists; several of its guesses were wrong (bare basenames instead of full
# paths, workflow files missing their `.github/workflows/` prefix, extension
# fragments like `.js`/`.ts`, and paths AGENTS.md explicitly documents as not
# existing yet under "Known drift"). Those are fixed or removed below — see
# AGENTS.md's "Known drift, not yet reconciled" section for why some claims are
# intentionally absent from this file rather than asserted false.
version: 1

files:
  include:
    - 'CLAUDE.md'
    - 'AGENTS.md'
  exclude:
    - 'node_modules/**'

assertions:
  - id: path-claude-plugin-plugin-json
    extractor: fileExists
    extractorArgs:
      path: '.claude-plugin/plugin.json'
    scanner: literalInMd
    scannerArgs:
      literal: '.claude-plugin/plugin.json'
  - id: path-README-md
    extractor: fileExists
    extractorArgs:
      path: 'README.md'
    scanner: literalInMd
    scannerArgs:
      literal: 'README.md'
  - id: path-agents
    extractor: fileExists
    extractorArgs:
      path: '.agents'
    scanner: literalInMd
    scannerArgs:
      literal: '.agents'
  - id: path-agents-skills-README-md
