# Release Please
#
# Manages automated releases on merge to main.
# - Opens/updates a Release PR that bumps package.json version and generates CHANGELOG.md
# - When the Release PR is merged, creates a GitHub Release with a git tag
#
# dist/ is not attached to releases: it is committed to main by bundle.yml, and
# that is where the plugin installs from. Releases here are immutable, so assets
# cannot be added after publication and the upload could never have worked.

name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@7987652d64b4581673a76e33ad5e98e3dd56832f # v4.1.3
        id: release
        with:
          release-type: node
          token: ${{ steps.token.outputs.token }}

      # outputs.pr is the whole pull request as JSON, not its number, and it is
      # empty on runs with nothing to release. It is passed through the
      # environment as raw JSON and parsed here: interpolating it into the
      # script put the generated changelog on the command line, and calling
      # fromJSON() on it broke the workflow template whenever it was empty.
      - name: Merge Release PR
        if: ${{ steps.release.outputs.pr }}
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          PR_NUMBER=$(jq -r '.number' <<<"$PR_JSON")
          echo "Release PR is #$PR_NUMBER"

          # Checks appear a few seconds after release-please pushes the branch,
          # and this step starts within a second of that. Wait for them to
          # register, keyed on the message gh actually prints, so "none yet" is
          # never read as "none failing". Failing closed here is deliberate: if
          # checks never arrive, the release does not go out unattended.
          deadline=$(( SECONDS + 300 ))
          while :; do
            checks=$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" 2>&1) || true
            case "$checks" in
              *"no checks reported"*)
                if [ "$SECONDS" -ge "$deadline" ]; then
                  echo "::error::No checks registered on #$PR_NUMBER within 5 minutes. Not merging."
                  exit 1
                fi
                echo "Waiting for checks to register on #$PR_NUMBER..."
                sleep 10
                ;;
              *) break ;;
            esac
          done

          # main is unprotected, so GitHub will not gate this merge for us.
          # Gate it here instead: a release must never ship on a red pipeline.
          if ! gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --watch --fail-fast --interval 15; then
            echo "::error::Release PR #$PR_NUMBER has failing checks. Not merging."
            exit 1
          fi

          # Auto-merge needs branch protection to supply the checks it waits on,
          # so it is refused here today. Attempt it anyway, so protecting main
          # later hands the gating back to GitHub with no change to this file.
          if gh pr merge --auto --squash "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"; then
            echo "Queued auto-merge for #$PR_NUMBER."
          else
            echo "Auto-merge unavailable; merging #$PR_NUMBER now that its checks are green."
            gh pr merge --squash "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          fi
