# Release Please
#
# Manages automated releases on merge to main.
# - Opens/updates a Release PR that bumps package.json version and generates CHANGELOG.md
# - When the Release PR is merged, creates a GitHub Release with a git tag
# - On release creation, builds and uploads dist/ as release assets

name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@7987652d64b4581673a76e33ad5e98e3dd56832f # v4.1.3
        id: release
        with:
          release-type: node
          token: ${{ steps.token.outputs.token }}

      - name: Auto-merge Release PR
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh pr merge --auto --squash "${{ steps.release.outputs.pr }}" --repo ${{ github.repository }}

  build-and-upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: jdx/mise-action@v4
        with:
          # Bust the action's install cache: a prior run cached a failed
          # aislop/ctxharness install, and the cache key doesn't change just
          # because mise.toml's *contents* are unchanged, so it kept
          # restoring the same broken state on every retry.
          cache_key_prefix: mise-v2-ctxharness
        env:
          # mise's npm backend prompts for confirmation the first time it
          # resolves a package (aislop/ctxharness/actionlint); there's no TTY
          # in CI to answer it, so `mise install` aborts without this.
          MISE_YES: "1"

      - run: bun install

      - run: mise run build

      - name: Upload dist as release assets
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            dist/hooks/inject.mjs \
            dist/cli/switch.mjs \
            dist/install.mjs \
            --repo ${{ github.repository }}
