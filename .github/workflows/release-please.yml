# Release Please
#
# Manages automated releases on merge to main.
# - Opens/updates a Release PR that bumps package.json version and generates CHANGELOG.md
# - When the Release PR is merged, creates a GitHub Release with a git tag
# - On release creation, builds and uploads dist/ as release assets

name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@7987652d64b4581673a76e33ad5e98e3dd56832f # v4.1.3
        id: release
        with:
          release-type: node
          token: ${{ steps.token.outputs.token }}

      # outputs.pr is the whole pull request as JSON, not its number, and it is
      # empty on runs with nothing to release. It is passed through the
      # environment as raw JSON and parsed here: interpolating it into the
      # script put the generated changelog on the command line, and calling
      # fromJSON() on it broke the workflow template whenever it was empty.
      - name: Merge Release PR
        if: ${{ steps.release.outputs.pr }}
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          PR_NUMBER=$(jq -r '.number' <<<"$PR_JSON")
          echo "Release PR is #$PR_NUMBER"

          # Checks appear a few seconds after release-please pushes the branch,
          # and this step starts within a second of that. Wait for them to
          # register, keyed on the message gh actually prints, so "none yet" is
          # never read as "none failing". Failing closed here is deliberate: if
          # checks never arrive, the release does not go out unattended.
          deadline=$(( SECONDS + 300 ))
          while :; do
            checks=$(gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" 2>&1) || true
            case "$checks" in
              *"no checks reported"*)
                if [ "$SECONDS" -ge "$deadline" ]; then
                  echo "::error::No checks registered on #$PR_NUMBER within 5 minutes. Not merging."
                  exit 1
                fi
                echo "Waiting for checks to register on #$PR_NUMBER..."
                sleep 10
                ;;
              *) break ;;
            esac
          done

          # main is unprotected, so GitHub will not gate this merge for us.
          # Gate it here instead: a release must never ship on a red pipeline.
          if ! gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --watch --fail-fast --interval 15; then
            echo "::error::Release PR #$PR_NUMBER has failing checks. Not merging."
            exit 1
          fi

          # Auto-merge needs branch protection to supply the checks it waits on,
          # so it is refused here today. Attempt it anyway, so protecting main
          # later hands the gating back to GitHub with no change to this file.
          if gh pr merge --auto --squash "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"; then
            echo "Queued auto-merge for #$PR_NUMBER."
          else
            echo "Auto-merge unavailable; merging #$PR_NUMBER now that its checks are green."
            gh pr merge --squash "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          fi

  build-and-upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          # Bust the action's install cache: a prior run cached a failed
          # aislop/ctxharness install, and the cache key doesn't change just
          # because mise.toml's *contents* are unchanged, so it kept
          # restoring the same broken state on every retry.
          cache_key_prefix: mise-v2-ctxharness
        env:
          # mise's default npm backend (aube) refuses to install a
          # low-weekly-download package non-interactively in CI
          # (npm:ctxharness) rather than prompting; there's no `--allow-low-
          # downloads` passthrough, so fall back to shelling out to real npm
          # instead of aube's vetting-heavy resolver.
          MISE_YES: "1"
          MISE_NPM_SHELL_OUT: "1"

      - run: bun install

      - run: mise run build

      - name: Upload dist as release assets
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            dist/hooks/inject.mjs \
            dist/cli/switch.mjs \
            dist/install.mjs \
            --repo ${{ github.repository }}
