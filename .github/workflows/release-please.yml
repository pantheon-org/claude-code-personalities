# Release Please
#
# Manages automated releases on merge to main.
# - Opens/updates a Release PR that bumps package.json version and generates CHANGELOG.md
# - When the Release PR is merged, creates a GitHub Release with a git tag
# - On release creation, builds and uploads dist/ as release assets

name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@7987652d64b4581673a76e33ad5e98e3dd56832f # v4.1.3
        id: release
        with:
          release-type: node
          token: ${{ steps.token.outputs.token }}

      # outputs.pr is the whole pull request as JSON, not its number. Pasting it
      # into the command line put the generated changelog — parentheses, quotes
      # and all — straight into the shell, so this step failed every time a
      # release PR existed. Take the number, and pass it through the
      # environment rather than interpolating it into the script.
      - name: Merge Release PR
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_NUMBER: ${{ fromJSON(steps.release.outputs.pr).number }}
        run: |
          # Auto-merge means "merge once the required checks pass", so GitHub
          # only accepts it when the base branch has protection rules to supply
          # those checks. main is currently unprotected, so the API refuses the
          # request and there is nothing to wait for anyway. Attempt it first,
          # so protecting the branch later restores the safer behaviour with no
          # further change here, and merge directly when it is unavailable.
          if gh pr merge --auto --squash "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"; then
            echo "Queued auto-merge for #$PR_NUMBER."
          else
            echo "Auto-merge unavailable (see error above); merging #$PR_NUMBER now."
            gh pr merge --squash "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          fi

  build-and-upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          # Bust the action's install cache: a prior run cached a failed
          # aislop/ctxharness install, and the cache key doesn't change just
          # because mise.toml's *contents* are unchanged, so it kept
          # restoring the same broken state on every retry.
          cache_key_prefix: mise-v2-ctxharness
        env:
          # mise's default npm backend (aube) refuses to install a
          # low-weekly-download package non-interactively in CI
          # (npm:ctxharness) rather than prompting; there's no `--allow-low-
          # downloads` passthrough, so fall back to shelling out to real npm
          # instead of aube's vetting-heavy resolver.
          MISE_YES: "1"
          MISE_NPM_SHELL_OUT: "1"

      - run: bun install

      - run: mise run build

      - name: Upload dist as release assets
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            dist/hooks/inject.mjs \
            dist/cli/switch.mjs \
            dist/install.mjs \
            --repo ${{ github.repository }}
