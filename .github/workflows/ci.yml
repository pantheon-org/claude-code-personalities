name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          # Bust the action's install cache: a prior run cached a failed
          # aislop/ctxharness install, and the cache key doesn't change just
          # because mise.toml's *contents* are unchanged, so it kept
          # restoring the same broken state on every retry.
          cache_key_prefix: mise-v2-ctxharness
        env:
          # mise's default npm backend (aube) refuses to install a
          # low-weekly-download package non-interactively in CI
          # (npm:ctxharness) rather than prompting; there's no `--allow-low-
          # downloads` passthrough, so fall back to shelling out to real npm
          # instead of aube's vetting-heavy resolver.
          MISE_YES: "1"
          MISE_NPM_SHELL_OUT: "1"

      - run: bun install

      - run: bunx tsc --noEmit

      - run: biome check src/

      - run: bun test
