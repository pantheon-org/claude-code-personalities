name: Bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config*'
      - '.claude-plugin/**'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}

      - uses: jdx/mise-action@v4
        env:
          # mise's npm backend prompts for confirmation the first time it
          # resolves a package (aislop/ctxharness/actionlint); there's no TTY
          # in CI to answer it, so `mise install` aborts without this.
          MISE_YES: "1"

      - run: bun install

      - run: bunx tsc --noEmit

      - run: mise run build

      - name: Commit dist
        run: |
          git config user.name "pantheon-org-bot[bot]"
          git config user.email "pantheon-org-bot[bot]@users.noreply.github.com"
          git add -f dist/hooks/inject.mjs dist/cli/switch.mjs dist/install.mjs
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "ci: update dist bundles"
          git push
