name: Bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'vite.config*'
      - '.claude-plugin/**'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}
          # shipped-hashes.json is regenerated from the history of data/, so a
          # shallow clone would rebuild it with only the tip commit's hashes.
          fetch-depth: 0

      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          # Bust the action's install cache: a prior run cached a failed
          # aislop/ctxharness install, and the cache key doesn't change just
          # because mise.toml's *contents* are unchanged, so it kept
          # restoring the same broken state on every retry.
          cache_key_prefix: mise-v2-ctxharness
        env:
          # mise's default npm backend (aube) refuses to install a
          # low-weekly-download package non-interactively in CI
          # (npm:ctxharness) rather than prompting; there's no `--allow-low-
          # downloads` passthrough, so fall back to shelling out to real npm
          # instead of aube's vetting-heavy resolver.
          MISE_YES: "1"
          MISE_NPM_SHELL_OUT: "1"

      - run: bun install

      - run: bunx tsc --noEmit

      - run: mise run build

      # Identity comes from the token step rather than a hardcoded name: the
      # literal that used to sit here ("pantheon-org-bot[bot]") did not match
      # the app actually pushing, which made these commits hard to trace back
      # to the app that produced them.
      - name: Commit dist
        env:
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add -f dist/hooks/inject.mjs dist/cli/switch.mjs dist/install.mjs schema/shipped-hashes.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "ci: update dist bundles"
          git push
